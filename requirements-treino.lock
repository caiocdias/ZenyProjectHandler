# Lock opt-in de treino do detector (E11/E12); nunca incluir nos requisitos de cliente, servidor, desenvolvimento ou release.
# Python exigido: 3.11, Windows x64 (artefatos cp311/win_amd64 ou py3-none-any).
# Variante: PyTorch em CPU (torch/torchvision "+cpu" do índice download.pytorch.org/whl/cpu),
# escolhida pelo spike E11 (ADR 0017, seção "Caminho de treino (E11)").
# Modo hash do pip: cada pino aceita só o artefato exato, o que bloqueia homônimos de outro
# índice (confusão de dependência).
# A variante ROCm medida (que falhou no BatchNorm de treino do MIOpen) está descrita no ADR 0017 e
# em tmp\treino-e11\instalacao.md, com os hashes dos seus artefatos.
# Instalação num venv próprio fora do Git, com um Python 3.11, por exemplo:
#   py -3.11 -m venv tmp\treino-e11\venv-cpu
#   tmp\treino-e11\venv-cpu\Scripts\python.exe -m pip install -r requirements-treino.lock
--index-url https://download.pytorch.org/whl/cpu
--extra-index-url https://pypi.org/simple
