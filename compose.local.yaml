services:
  server:
    image: "${ZENY_LOCAL_SERVER_IMAGE:-zeny-project-handler-server:local}"
    build:
      context: .
      target: runtime
    environment:
      ZENY_SERVER_PASSWORD: "${ZENY_SERVER_PASSWORD:?senha local ausente}"
      ZENY_SERVER_HOST: "0.0.0.0"
      ZENY_SERVER_PORT: "8000"
      ZENY_SERVER_DATA_DIR: "/data"
      ZENY_SERVER_LOG_LEVEL: "${ZENY_SERVER_LOG_LEVEL:-INFO}"
      ZENY_SERVER_UPLOAD_MAX_BYTES: "${ZENY_SERVER_UPLOAD_MAX_BYTES:-268435456}"
      ZENY_SERVER_RENDER_DPI: "${ZENY_SERVER_RENDER_DPI:-600}"
      ZENY_SERVER_RENDER_MAX_PIXELS: "${ZENY_SERVER_RENDER_MAX_PIXELS:-8000000}"
      ZENY_SERVER_RENDER_MAX_BYTES: "${ZENY_SERVER_RENDER_MAX_BYTES:-67108864}"
      ZENY_SERVER_VIEWER_SESSION_TTL_SECONDS: "${ZENY_SERVER_VIEWER_SESSION_TTL_SECONDS:-900}"
      ZENY_SERVER_VIEWER_MAX_FILES: "${ZENY_SERVER_VIEWER_MAX_FILES:-20}"
      ZENY_SERVER_JOB_RETENTION_SECONDS: "${ZENY_SERVER_JOB_RETENTION_SECONDS:-86400}"
      ZENY_SERVER_JOB_MAX_RETAINED: "${ZENY_SERVER_JOB_MAX_RETAINED:-100}"
      ZENY_SERVER_TRANSFER_TTL_SECONDS: "${ZENY_SERVER_TRANSFER_TTL_SECONDS:-3600}"
    ports:
      - "127.0.0.1:${ZENY_LOCAL_SERVER_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /data:rw,nosuid,nodev,size=${ZENY_LOCAL_DATA_TMPFS_SIZE:-1g},mode=0700,uid=10001,gid=10001
      - /tmp:rw,noexec,nosuid,nodev,size=${ZENY_SERVER_TMPFS_SIZE:-268435456}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${ZENY_SERVER_PIDS_LIMIT:-256}
    mem_limit: ${ZENY_SERVER_MEMORY_LIMIT:-2g}
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()
      interval: 2s
      timeout: 3s
      start_period: 20s
      retries: 30
    restart: "no"
    stop_signal: SIGTERM
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "1"
