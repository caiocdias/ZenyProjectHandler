# Lock opt-in de treino do detector (E11/E12); nunca incluir nos requisitos de cliente, servidor, desenvolvimento ou release.
# Python exigido: 3.12 (os wheels ROCm para Windows só existem em cp312), Windows x64.
# Variante: PyTorch ROCm nativo no Windows, índice de release oficial da AMD (rocm-rel-7.2.1).
# Modo hash do pip: cada pino aceita só o artefato exato (cp312/win_amd64, py3-none-any ou o
# sdist rocm), o que bloqueia homônimos publicados no PyPI (confusão de dependência).
# Limite do pip: o build isolado do sdist rocm baixa "setuptools>=70.2.0" do PyPI sem hash.
# Instalação num venv próprio fora do Git, com um Python 3.12, por exemplo:
#   py -3.12 -m venv tmp\treino-e11\venv-rocm
#   (ou, com o runtime extraído por "py install -t tmp\treino-e11\python312 3.12":
#    tmp\treino-e11\python312\python.exe -m venv tmp\treino-e11\venv-rocm)
#   tmp\treino-e11\venv-rocm\Scripts\python.exe -m pip install -r requirements-treino.lock
